[project]
name = "ieso-benchmark-tools"
version = "0.1.0"
description = "FastMCP tools for IESO agent synthetic benchmark generation"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "openai>=1.0",
    "numpy>=1.26",
    "rank-bm25>=0.2",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
